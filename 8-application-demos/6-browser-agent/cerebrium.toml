[cerebrium.deployment]
name = "6-browser-agent"
python_version = "3.12"
docker_base_image_url = "mcr.microsoft.com/playwright/python:v1.63.0-noble"
disable_auth = false
include = ['./*', 'main.py', 'cerebrium.toml']
exclude = ['.*']

[cerebrium.runtime.custom]
port = 8000
entrypoint = ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
healthcheck_endpoint = "/health"
readycheck_endpoint = "/ready"

[cerebrium.hardware]
cpu = 4
memory = 8.0
compute = "CPU"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 3
cooldown = 30
replica_concurrency = 4
scaling_metric = "concurrency_utilization"

[cerebrium.dependencies.pip]
playwright = "==1.63.0"
fastapi = "latest"
uvicorn = "latest"
pydantic = "latest"
loguru = "latest"
