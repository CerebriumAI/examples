[cerebrium.deployment]
name = "1-ollama"
python_version = "3.11"
disable_auth = true
include = ["./*", "cerebrium.toml", "Dockerfile", "entrypoint.sh", "nginx.conf"]
exclude = [".*", "ollama/**"]
deployment_initialization_timeout = 830

[cerebrium.hardware]
cpu = 4
memory = 16.0
compute = "AMPERE_A10"
region = "us-east-1"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 3
cooldown = 60
replica_concurrency = 1
response_grace_period = 1800
scaling_metric = "concurrency_utilization"
scaling_target = 100

[cerebrium.runtime.custom]
port = 11434
healthcheck_endpoint = "/"
dockerfile_path = "./Dockerfile"
