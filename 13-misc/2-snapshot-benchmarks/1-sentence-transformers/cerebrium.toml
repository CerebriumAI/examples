[cerebrium.deployment]
name = "snapshot-sentence-transformers"
python_version = "3.11"
disable_auth = true
include = ['./*', 'main.py', 'cerebrium.toml']
exclude = ['.*']

[cerebrium.hardware]
cpu = 10.0
memory = 16.0
compute = "AMPERE_A10"
region = "us-east-1"
provider = "aws"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 2
cooldown = 10
replica_concurrency = 1
scaling_metric = "concurrency_utilization"

[cerebrium.dependencies.pip]
sentence-transformers = "latest"
torch = "2.8.0"
requests = "latest"

[cerebrium.experimental]
checkpointing = true