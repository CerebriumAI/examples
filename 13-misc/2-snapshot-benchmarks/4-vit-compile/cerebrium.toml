[cerebrium.deployment]
name = "snapshot-vit-compile"
python_version = "3.11"
docker_base_image_url = "nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04"
disable_auth = true
include = ['./*', 'main.py', 'cerebrium.toml']
exclude = ['.*']

[cerebrium.hardware]
cpu = 4.0
memory = 16.0
compute = "ADA_L40"
region = "eu-north-1"
provider = "aws"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 2
cooldown = 10
replica_concurrency = 1
scaling_metric = "concurrency_utilization"

[cerebrium.dependencies.pip]
torch = "latest"
torchvision = "latest"
transformers = "latest"
accelerate = "latest"
pillow = "latest"
requests = "latest"

[cerebrium.runtime]
container_runtime = "v2"  # Required for Cerebrium memory checkpointing.
