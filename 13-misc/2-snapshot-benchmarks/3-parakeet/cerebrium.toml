[cerebrium.deployment]
name = "snapshot-parakeet"
python_version = "3.11"
docker_base_image_url = "nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04"
disable_auth = true
include = ['./*', 'main.py', 'cerebrium.toml']
exclude = ['.*']
# NeMo's load + lazy init runs past the default 10-min readiness window on a
# no-snapshot cold start, so give it the Cerebrium max.
deployment_initialization_timeout = 830

[cerebrium.hardware]
cpu = 10.0
memory = 24.0
compute = "AMPERE_A10"
region = "us-east-1"
provider = "aws"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 2
cooldown = 30
replica_concurrency = 1
scaling_metric = "concurrency_utilization"

[cerebrium.dependencies.pip]
"nemo_toolkit[asr]" = "2.3.2"
"cuda-python" = "12.8.0"
requests = "latest"

[cerebrium.experimental]
checkpointing = true