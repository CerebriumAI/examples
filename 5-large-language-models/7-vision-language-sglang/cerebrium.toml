[cerebrium.deployment]
name = "7-vision-language-sglang"
python_version = "3.11"
docker_base_image_url = "nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04"
disable_auth = true
deployment_initialization_timeout = 830
include = ["./*", "main.py", "cerebrium.toml"]
exclude = [".*"]
pre_build_commands = [
    "pip install sglang[all]>=0.4.2.post2 --find-links https://flashinfer.ai/whl/cu124/torch2.5/flashinfer"
]

[cerebrium.hardware]
cpu = 10.0
memory = 60.0
compute = "ADA_L40"
provider = "aws"
region = "us-east-1"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 2
cooldown = 30

[cerebrium.dependencies.pip]
transformers = "latest"
huggingface_hub = "latest"
pydantic = "latest"
pillow = "latest"
requests = "latest"

[cerebrium.dependencies.apt]
libnuma-dev = "latest"

[cerebrium.experimental]
checkpointing = true

[cerebrium.runtime.custom]
port = 8000
entrypoint = ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
healthcheck_endpoint = "/health"
